name: Release

# Збирає amd64-образи всіх сервісів і кладе в GHCR. Звідти їх тягне сервер.
#
# Чому jar збирається окремо від образу: Java-байткод не залежить від
# архітектури, тож Maven працює на звичайному x86-ранері, а в amd64-образ
# лише копіюється готовий файл. Жодного RUN під емуляцією — хвилини замість
# десятків хвилин.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: image ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - place-service
          - trip-service
          - context-service
          - planner-service
          - offer-service
          - media-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Тести вже прогнав CI на цьому ж коміті — тут лише пакування.
      - name: Зібрати jar
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp -DskipTests package

      - name: Підготувати контекст образу
        run: |
          mkdir -p image-context
          cp ${{ matrix.service }}/target/*.jar image-context/app.jar
          cp deploy/Dockerfile.runtime image-context/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/waylo-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Зібрати й запушити
        uses: docker/build-push-action@v6
        with:
          context: image-context
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
