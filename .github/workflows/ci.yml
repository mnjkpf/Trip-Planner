name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Нові пуші в ту саму гілку скасовують попередній запуск: вісім джобів із
# Testcontainers — задоволення не безкоштовне.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - place-service
          - trip-service
          - context-service
          - planner-service
          - media-service
          - offer-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Інтеграційні тести піднімають Postgres, Kafka, Redis і SeaweedFS через
      # Testcontainers. На ubuntu-latest Docker уже є, окремих кроків не треба.
      - name: mvnw verify
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp verify

      - name: Звіти тестів
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - run: npm ci

      # Справжній environment.ts у git не лежить (у ньому ключ Google Maps),
      # тож для складання підсовуємо шаблон — коду достатньо самої наявності файлу.
      - name: Підготувати environment.ts
        run: cp src/environments/environment.example.ts src/environments/environment.ts

      - name: Складання
        run: npm run build

      # Ключі перекладів мають збігатися в усіх мовах: забутий рядок в одній з них
      # інакше помітно лише тоді, коли користувач бачить сире "photos.add".
      - name: Переклади вирівняні
        run: node ../../.github/scripts/check-i18n.mjs
