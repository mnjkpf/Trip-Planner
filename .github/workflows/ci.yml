name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - place-service
          - trip-service
          - context-service
          - planner-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvnw verify
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp verify
