<header class="topbar">
  <a class="brand" routerLink="/trips">✈ Trip Planner</a>
  @if (auth.isLoggedIn()) {
    <nav class="nav">
      <a routerLink="/trips" routerLinkActive="active">Подорожі</a>
      <a routerLink="/places" routerLinkActive="active">Місця</a>
      <a routerLink="/wishlist" routerLinkActive="active">Вішліст</a>
      <button class="link" (click)="logout()">Вийти</button>
    </nav>
  }
</header>

<main class="content">
  <router-outlet />
</main>
