spring.application.name=api-gateway
server.port=8080

# ---------- Redis (для rate limiter) ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------- Resource Server: RS256 через JWKS user-service ----------
# Приватний ключ лише в user-service; gateway бере публічний з JWKS і
# перевіряє підпис сам. Nimbus тягне ключі лениво, тож gateway стартує
# навіть коли user-service ще не піднятий.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# ---------- Маршрути ----------
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/user/**

# Публічне vs захищене вже НЕ вирішується тут через фільтр на маршруті.
# Вирішує SecurityConfig за шляхом: /api/auth/** і /api/user/register-user
# відкриті, решта /api/user/** вимагає токена.

# Наступні маршрути — коли зʼявляться сервіси (порти з плану):
