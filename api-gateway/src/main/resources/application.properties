# spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/plans/**

# ---------- Rate limiter (Redis) на всі маршрути ----------
# KeyResolver — bean ipKeyResolver у RateLimiterConfig.
spring.cloud.gateway.server.webflux.default-filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.default-filters[0].args.redis-rate-limiter.requestedTokens=1

# ---------- CORS ----------
# allow-credentials=true несумісний з "*", тому вказуємо явні origin-и.
# Angular у розробці — 4200.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,gateway
