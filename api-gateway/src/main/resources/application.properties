spring.application.name=api-gateway

server.port=8080


spring.cloud.gateway.server.webflux.routes[0].id=user-service-public
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/user/register-user

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/user/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtAuthFilter


spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# JWT (без дефолту — сервіс мусить fail-fast, якщо секрет не переданий)
app.jwt.secret=${JWT_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info