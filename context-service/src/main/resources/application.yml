server:
  port: 8084

spring:
  application:
    name: context-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/contextdb
    username: ${POSTGRES_USER:tp}
    password: ${POSTGRES_PASSWORD:tp}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Проєкція маршрутів для погодного нагляду (watched_trips).
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: context-service
      # earliest: при першому старті вичитуємо всі знімки, що вже лежать у топіку
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

app:
  topics:
    itinerary-snapshot: trip.itinerary.snapshot
    weather-alert: trip.weather.alert
  weather-watch:
    # false — вимкнути плановий прохід (поради після правок маршруту все одно йдуть).
    enabled: true
    # За скільки днів до старту починаємо стежити. Далі тижня прогноз опадів
    # уже надто приблизний, щоб радити переставляти дні.
    lookahead-days: 7
    initial-delay: PT1M
    interval: PT6H
    forecast-cache-minutes: 30
  providers:
    open-meteo:
      # Безкоштовний, без API-ключа. Прогноз ~16 днів наперед; далі — деградуємо до сезону.
      base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
