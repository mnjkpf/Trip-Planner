server:
  port: 8083

spring:
  application:
    name: trip-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/tripdb
    username: ${POSTGRES_USER:tp}
    password: ${POSTGRES_PASSWORD:tp}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: trip-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

app:
  outbox:
    # Publisher вичитує неопубліковані події й відправляє в Kafka.
    # Запис у outbox іде в ТУ САМУ транзакцію, що й зміна даних — це і є
    # розв'язання проблеми dual write.
    poll-interval-ms: 1000
    batch-size: 100
  services:
    place-uri: ${SVC_PLACE_URI:http://localhost:8082}
    # Тікети на завантаження фото (єдиний синхронний виклик у бік медіа).
    media-uri: ${SVC_MEDIA_URI:http://localhost:8088}
    # Потрібен лише для запрошення учасників: шукаємо userId за поштою.
    user-uri: ${SVC_USER_URI:http://localhost:8081}
  topics:
    plan-completed: trip.plan.completed
    # Знімок маршруту для context-service (event-carried state transfer).
    itinerary-snapshot: trip.itinerary.snapshot
    # Погодні попередження від context-service — лише поради, маршрут не міняємо.
    weather-alert: trip.weather.alert
    # Фото: media-service каже, що файл на місці; ми — коли байти вже не потрібні.
    media-ready: media.ready
    media-delete-requested: media.delete.requested
  weather:
    # На старті перевидати знімки ще не завершених подорожей (ідемпотентно).
    snapshot-backfill: true
  place-images:
    # Дотягування фото місць для старих маршрутів (нові приходять разом із планом).
    backfill: true
    initial-delay: PT30S
    # Черга розбирається пачками: 50 пунктів за прохід. Коли вона порожня,
    # прохід коштує один індексований запит — тому інтервал можна тримати малим.
    interval: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
